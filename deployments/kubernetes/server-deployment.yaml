apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvc-server
  namespace: pvc
  labels:
    app.kubernetes.io/name: prompt-version-control
    app.kubernetes.io/component: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: prompt-version-control
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prompt-version-control
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: pvc-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/reaatech/prompt-version-control/server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: pvc-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pvc-secret
                  key: JWT_SECRET
            - name: EVAL_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: pvc-secret
                  key: EVAL_WEBHOOK_SECRET
            - name: API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: pvc-secret
                  key: API_KEY_PEPPER
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pvc-secret
                  key: DATABASE_URL
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pvc-secret
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: 'redis://:$(REDIS_PASSWORD)@pvc-redis:6379'
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: '256Mi'
              cpu: '250m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      tolerations: []
      affinity: {}
