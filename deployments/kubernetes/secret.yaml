apiVersion: v1
kind: Secret
metadata:
  name: pvc-secret
  namespace: pvc
  labels:
    app.kubernetes.io/name: prompt-version-control
    app.kubernetes.io/component: server
type: Opaque
stringData:
  # Replace these placeholders with actual values before applying.
  # Use external secret management (e.g., Sealed Secrets, External Secrets Operator)
  # for production clusters.
  JWT_SECRET: 'REPLACE_ME'
  EVAL_WEBHOOK_SECRET: 'REPLACE_ME'
  API_KEY_PEPPER: 'REPLACE_ME'
  DATABASE_URL: 'postgresql://postgres:REPLACE_ME@pvc-postgres:5432/pvc?schema=public'
  REDIS_PASSWORD: 'REPLACE_ME'
